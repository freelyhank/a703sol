<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img">
  <title>Tabulora ledger monogram</title>
  <desc>A T and an A cut from record plates: closed counters are written rows, the acid plate is the next entry.</desc>
  <rect width="128" height="128" rx="20" fill="#15151b"/>
  <rect x="0.5" y="0.5" width="127" height="127" rx="20" fill="none" stroke="#24241f" stroke-width="1"/>
  <g transform="translate(64 64) scale(.84) translate(-64 -64)">
    <g fill="#07070a">
    <rect x="14" y="30" width="48" height="14"/>
    <rect x="31" y="44" width="14" height="60"/>
    <rect x="76" y="30" width="46" height="14"/>
    <rect x="76" y="67" width="46" height="12"/>
    <rect x="76" y="44" width="12" height="60"/>
    <rect x="110" y="44" width="12" height="60"/>
    </g>
    <rect x="49" y="44" width="13" height="32" fill="#15151b"/>
    <rect x="88" y="79" width="22" height="25" fill="#15151b"/>
    <rect x="88" y="44" width="22" height="23" fill="#c8f04a"/>
  </g>
</svg>
