<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img">
  <title>Tabulora — Community work, kept in the open.</title>
  <desc>A cream card with the Tabulora tile mark, a serif headline and three labels for quests, advisory votes and treasury reads.</desc>

  <defs>
    <radialGradient id="warm" cx="0.06" cy="-0.12" r="0.9">
      <stop offset="0" stop-color="#b1741a" stop-opacity="0.18" />
      <stop offset="1" stop-color="#b1741a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cool" cx="0.98" cy="-0.08" r="0.8">
      <stop offset="0" stop-color="#14503f" stop-opacity="0.16" />
      <stop offset="1" stop-color="#14503f" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#f2ebdf" />
  <rect width="1200" height="630" fill="url(#warm)" />
  <rect width="1200" height="630" fill="url(#cool)" />

  <!-- mark and wordmark -->
  <rect x="72" y="58" width="56" height="56" rx="16" fill="#14503f" />
  <rect x="84" y="74" width="32" height="5.4" rx="2.7" fill="#f7f1e5" />
  <rect x="84" y="85" width="22.5" height="5.4" rx="2.7" fill="#f7f1e5" opacity="0.72" />
  <rect x="84" y="96" width="13" height="5.4" rx="2.7" fill="#f7f1e5" opacity="0.46" />

  <text x="148" y="98" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="42" letter-spacing="-1" fill="#1c1710">Tabulora</text>
  <text x="1128" y="98" text-anchor="end" font-family="'Segoe UI', Arial, sans-serif" font-size="15" letter-spacing="3.2" fill="#665d4e">SOLANA TESTNET</text>

  <line x1="72" y1="176" x2="1128" y2="176" stroke="#ded1bb" stroke-width="1.5" />

  <!-- headline -->
  <text x="72" y="300" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="86" letter-spacing="-2.6" fill="#1c1710">Community work,</text>
  <text x="72" y="392" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="86" font-style="italic" letter-spacing="-2.6" fill="#14503f">kept in the open.</text>

  <!-- lede -->
  <text x="72" y="462" font-family="'Segoe UI', Arial, sans-serif" font-size="25" fill="#4b4235">Quests, advisory votes and treasury reads on one public record.</text>

  <!-- labels -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="14" letter-spacing="2.4" fill="#4b4235">
    <rect x="72" y="506" width="210" height="44" rx="22" fill="#fffdf8" stroke="#ded1bb" stroke-width="1.5" />
    <text x="177" y="534" text-anchor="middle">OPEN QUESTS</text>

    <rect x="298" y="506" width="206" height="44" rx="22" fill="#fffdf8" stroke="#ded1bb" stroke-width="1.5" />
    <text x="401" y="534" text-anchor="middle">ADVISORY VOTES</text>

    <rect x="520" y="506" width="210" height="44" rx="22" fill="#e3eee7" stroke="#c6d8ce" stroke-width="1.5" />
    <circle cx="547" cy="528" r="4" fill="#14503f" />
    <text x="563" y="534" fill="#14503f">NO TOKEN MINT</text>
  </g>

  <!-- footer line -->
  <line x1="72" y1="576" x2="1128" y2="576" stroke="#ded1bb" stroke-width="1.5" />
  <text x="72" y="606" font-family="'Segoe UI', Arial, sans-serif" font-size="14" letter-spacing="2.6" fill="#665d4e">INDEPENDENT COMMUNITY PROJECT</text>
  <text x="1128" y="606" text-anchor="end" font-family="'Segoe UI', Arial, sans-serif" font-size="14" letter-spacing="2.6" fill="#665d4e">TABULORA.XYZ</text>
</svg>
